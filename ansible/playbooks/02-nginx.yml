---
# Playbook: Servidor Web Nginx
# Uso: ansible-playbook -i inventory/hosts.yml playbooks/02-nginx.yml

- name: Configurar servidor web Nginx
  hosts: web_servers
  become: yes

  vars:
    domain: secureops.local

  tasks:
    - name: Instalar Nginx
      apt:
        name: nginx
        state: present

    - name: Crear página web principal del proyecto
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SecureOps — TFG ASIR2</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: 'Segoe UI', Tahoma, sans-serif;
                background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 100%);
                color: #fff; min-height: 100vh;
                display: flex; justify-content: center; align-items: center;
              }
              .container {
                text-align: center; padding: 2.5rem;
                background: rgba(255,255,255,0.05);
                border-radius: 20px; backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.1);
                max-width: 650px; width: 90%;
              }
              h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
              .subtitle { color: #00ff88; font-size: 1.1rem; margin-bottom: 1.5rem; }
              .grid {
                display: grid; grid-template-columns: 1fr 1fr;
                gap: 0.75rem; margin: 1.5rem 0;
              }
              .card {
                background: rgba(0,255,136,0.08);
                border: 1px solid rgba(0,255,136,0.3);
                border-radius: 10px; padding: 1rem;
              }
              .card h3 { color: #00ff88; font-size: 0.9rem; margin-bottom: 0.3rem; }
              .card a {
                color: #fff; text-decoration: none; font-size: 0.85rem;
              }
              .card a:hover { color: #00ff88; }
              .team { margin-top: 1.5rem; opacity: 0.6; font-size: 0.85rem; }
              .status { color: #00ff88; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>SecureOps</h1>
              <p class="subtitle">Infraestructura empresarial simulada — TFG ASIR2 2025</p>
              <p>Despliegue automatizado con Ansible + CloudInit sobre Proxmox VE</p>
              <div class="grid">
                <div class="card">
                  <h3>NOC — Monitoring</h3>
                  <a href="http://10.0.100.30:3000">Grafana Dashboard</a>
                </div>
                <div class="card">
                  <h3>SOC — SIEM</h3>
                  <a href="https://10.0.100.20">Wazuh Console</a>
                </div>
                <div class="card">
                  <h3>IDS</h3>
                  <a href="http://10.0.100.40">Suricata Alerts</a>
                </div>
                <div class="card">
                  <h3>Proxy</h3>
                  <span style="font-size:0.85rem">10.0.100.10:3128</span>
                </div>
              </div>
              <p class="status">Estado: Infraestructura operativa</p>
              <p class="team">Unai &nbsp;|&nbsp; Iker &nbsp;|&nbsp; Hamza — ALMI 2025</p>
            </div>
          </body>
          </html>
      notify: Reiniciar Nginx

    - name: Eliminar sitio default de Nginx
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reiniciar Nginx

    - name: Crear virtualhost para secureops.local
      copy:
        dest: /etc/nginx/sites-available/secureops
        content: |
          server {
              listen 80 default_server;
              server_name {{ domain }} www.{{ domain }} _;
              root /var/www/html;
              index index.html;
              location / {
                  try_files $uri $uri/ =404;
              }
              access_log /var/log/nginx/secureops_access.log;
              error_log  /var/log/nginx/secureops_error.log;
          }

    - name: Habilitar sitio secureops
      file:
        src: /etc/nginx/sites-available/secureops
        dest: /etc/nginx/sites-enabled/secureops
        state: link
      notify: Reiniciar Nginx

    - name: Permitir HTTP en UFW
      ufw:
        rule: allow
        port: "{{ item }}"
      loop:
        - '80'
        - '443'

  handlers:
    - name: Reiniciar Nginx
      service:
        name: nginx
        state: restarted
        enabled: yes
