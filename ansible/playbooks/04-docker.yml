---
# Playbook: Instalar Docker CE en srv-wazuh y srv-monitoring
# Usa el método moderno con keyring (no el deprecated apt_key)
# Uso: ansible-playbook -i inventory/hosts.yml playbooks/04-docker.yml

- name: Instalar Docker CE
  hosts: siem_servers:monitoring_servers
  become: yes

  tasks:
    - name: Instalar dependencias previas
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Crear directorio para keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Descargar clave GPG de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: no

    - name: Añadir repositorio de Docker
      apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Instalar Docker CE y docker compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Añadir usuario admin al grupo docker
      user:
        name: admin
        groups: docker
        append: yes

    - name: Habilitar y arrancar Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Verificar instalación de Docker
      command: docker --version
      register: docker_ver
      changed_when: false

    - name: Verificar Docker Compose
      command: docker compose version
      register: compose_ver
      changed_when: false

    - name: Mostrar versiones instaladas
      debug:
        msg:
          - "{{ docker_ver.stdout }}"
          - "{{ compose_ver.stdout }}"
